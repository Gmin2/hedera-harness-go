name: gifs

# renders the readme gifs from demo/*.tape and commits them back to the branch
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["demo/*.tape", ".github/workflows/gifs.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: install vhs with a stable ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg ttyd fonts-jetbrains-mono chromium-browser || sudo apt-get install -y -qq ffmpeg fonts-jetbrains-mono
          command -v ttyd || { curl -sL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 && sudo install /tmp/ttyd /usr/local/bin/ttyd; }
          go install github.com/charmbracelet/vhs@v0.12.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: render gifs
        run: |
          ffmpeg -version | head -1
          for t in hero agent run check init; do
            vhs demo/$t.tape
          done
          ls -la demo/assets
      - name: commit gifs
        run: |
          ls -la demo/assets
          git status --short --ignored demo/assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f demo/assets/*.gif || true
          git commit -m "render readme gifs" || echo "no gif changes"
          git push
