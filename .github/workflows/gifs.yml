name: gifs

# renders the readme gifs from demo/*.tape and commits them back to the branch
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["demo/*.tape", ".github/workflows/gifs.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/hero.tape
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/agent.tape
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/run.tape
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/check.tape
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/init.tape
      - name: commit gifs
        run: |
          ls -la demo/assets
          git status --short --ignored demo/assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f demo/assets/*.gif
          git commit -m "render readme gifs" || echo "no gif changes"
          git push
