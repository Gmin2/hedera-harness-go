name: gifs

# renders the readme gifs from demo/*.tape and commits them back to the branch
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["demo/*.tape", ".github/workflows/gifs.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/run.tape
      - name: render the rest
        run: |
          which ffmpeg ttyd vhs; ffmpeg -version | head -1
          for d in plain theme hide; do vhs .github/vhs-debug/$d.tape; done
          ls -la *.gif || echo "no debug gifs"
          for t in hero agent check init; do
            vhs demo/$t.tape; echo "vhs $t exit $?"
          done
          find / -name "*.gif" -newer go.mod 2>/dev/null | grep -v proc | head
      - name: commit gifs
        run: |
          ls -la demo/assets
          git status --short --ignored demo/assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f demo/assets/*.gif || true
          git commit -m "render readme gifs" || echo "no gif changes"
          git push
